# Dependency updates arrive as PRs into `migration` and go through the same required checks as any
# other PR (Phase 5 spec AC-DSO-02). Nothing here auto-merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    target-branch: migration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine minor/patch churn; majors stay separate so each can be reviewed.
      web-minor-and-patch:
        update-types: [minor, patch]
    # Majors that move only with a deliberate decision (owner, 2026-11-23, after #54 and #55):
    # `@types/node` follows the Node major in web/.nvmrc; React Router 8 gets its own spec after Phase 5.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps

  # The API (Phase 5, Q-p5-1 (b)) has its own lockfile (`sharedWorkspaceLockfile: false`), so it needs
  # its own entry (Q-p5-devsecops-5).
  - package-ecosystem: npm
    directory: /api
    target-branch: migration
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    # `/` covers .github/workflows; the composite action is listed explicitly.
    directories:
      - /
      - /.github/actions/setup-web
    target-branch: migration
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # The container images (p5-containers, DEV-p5-containers-09). Every base image and the compose `db` image
  # is pinned by version and digest (docker/check-images.sh fails otherwise), so without these entries the
  # pins would never move. Both ecosystems are version updates only ("Security updates: Not supported" for
  # `docker` and `docker-compose` in GitHub's "Dependabot supported ecosystems and repositories"); the
  # image scan is wave C's. Dependabot's docker parser reads literal FROM lines only, not an ARG default
  # (dependabot-core docker/lib/dependabot/docker/file_parser.rb), which is why the Dockerfiles write
  # each pin out on its FROM line. `docker` looks in /docker (api.Dockerfile, web.Dockerfile);
  # `docker-compose` in / (compose.yaml).
  - package-ecosystem: docker
    directory: /docker
    target-branch: migration
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: docker-compose
    directory: /
    target-branch: migration
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # `legacy/` is the frozen reference app (never modified, never built or deployed), so Dependabot must
  # not propose changes there (Q-p5-devsecops-6). `exclude-paths` is not enough: the options reference
  # marks it "version updates only". And a directory with no entry here gets security PRs
  # with default settings, which is how #47 happened. So `legacy/` gets its own entry: `ignore` on every
  # dependency is one of the options that also applies to security updates, and
  # `open-pull-requests-limit: 0` stops version updates. Alerts for `legacy/` still appear; they are
  # dismissed as "frozen reference code, never built or deployed". No `target-branch` here on purpose:
  # with it, an entry's options "no longer apply to security updates" (options reference).
  - package-ecosystem: npm
    directories:
      - /legacy/client
      - /legacy/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
