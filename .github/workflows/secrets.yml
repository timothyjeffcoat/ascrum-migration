# Secret scanning gate (Phase 5 spec §6 "secrets", Q-p5-7; Q-p5-devsecops-1 answered (b)). GitHub
# push protection stays on as the first line, but it produces no status check, so this job is the
# required one: Gitleaks over the commits a PR (or a push) adds, and over the checked-out tree.
#
# Gitleaks is the MIT-licensed CLI, run as a version-pinned release binary whose SHA-256 is checked.
# The version and checksum live in .github/actions/setup-gitleaks only, which ci.yml's e2e-compose job
# uses too (DEV-p5-containers-14). The `gitleaks-action` wrapper is not used: it has its own licence
# terms and needs a key for organisation repos.
#
# Nothing can mute it from inside the repo: a .gitleaks.toml or .gitleaksignore fails the job, and
# inline `gitleaks:allow` comments are ignored. An exception needs an owner-approved deviation and a
# reviewed change to this workflow.
name: Secrets

on:
  pull_request:
  push:
    branches: [migration]
  schedule:
    # New rules ship with new Gitleaks releases (bumped by hand here), so re-scan the tree weekly.
    - cron: '41 4 * * 1'

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit range below needs the history, not only the merge commit.
          fetch-depth: 0

      - name: Install Gitleaks (pinned, checksum-verified)
        uses: ./.github/actions/setup-gitleaks

      - name: No Gitleaks allowlists in the repo
        run: |
          found=$(git ls-files -- ':(glob)**/.gitleaks.toml' ':(glob)**/.gitleaksignore')
          if [ -n "$found" ]; then
            echo "::error::Gitleaks config or ignore file found: $found. An allowlist mutes the secrets gate, so it needs an owner-approved deviation (an answered Q-<cluster>-<n> and a row in spec/deviations.md) and a reviewed change to this workflow."
            exit 1
          fi

      - name: Scan the commits this change adds
        if: github.event_name != 'schedule'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Commits on the PR branch that the base does not have (merges from the base drop out).
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # No usable "before" (first push or rewritten history): scan the pushed commit itself.
            range="-1 $PUSH_AFTER"
          fi
          echo "git log range: $range"
          "$GITLEAKS" git --no-banner --redact --verbose --ignore-gitleaks-allow \
            --log-opts="$range" .

      - name: Scan the tree
        # Also when the commit scan failed, so one run reports both.
        if: ${{ !cancelled() }}
        run: |
          "$GITLEAKS" dir --no-banner --redact --verbose --ignore-gitleaks-allow .
