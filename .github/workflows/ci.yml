# The gates (spec §13 item 6). Each job is a separate required check on `migration`:
# lint, typecheck, test, build, e2e. Nothing merges unless all five are green.
name: CI

on:
  pull_request:
  push:
    branches: [migration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm build
      - run: pnpm build:pages

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Install Chromium (spec §11-5 measures this step)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  # Phase 5 (spec §6, Q-p5-8 (a)): the stub contract and AC-PG-* against a real PostgreSQL, run as a
  # service container. Same major version as compose.yaml. The credentials are throwaway values for a
  # database that lives only as long as this job; they are not secrets.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ascrum
          POSTGRES_PASSWORD: ascrum
          POSTGRES_DB: ascrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ascrum -d ascrum"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ascrum:ascrum@localhost:5432/ascrum
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm test:integration

  # Phase 5 (spec §6, cluster p5-containers): the images built from this commit, checked, started with
  # compose, and the full Playwright suite run against them (AC-CTR-01..03, §3.3). The database and its
  # credentials (compose.yaml) are throwaway values that live only as long as this job.
  e2e-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ascrum-ci
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      # docker/check-images.sh scans the images' own layers and config with Gitleaks: the same pinned,
      # checksum-verified release as the secrets job, from the one action that holds the pin
      # (DEV-p5-containers-14). It sets GITLEAKS.
      - name: Install Gitleaks (pinned, checksum-verified)
        uses: ./.github/actions/setup-gitleaks
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the images
        working-directory: .
        run: docker compose --profile prod-check build
      # Every fact about the images' files (modes, file capabilities, apk's database, what the runtime stage
      # added to its base) is read on the host from `docker save` by docker/image-fs.ts, on the Node 24 that
      # setup-web installed; no binary from the images answers for them (p5-image-host, DEV-p5-image-scan-10,
      # -14, -15).
      - name: AC-CTR-02 images (non-root, no dev deps, tests or .env), pins, no secrets in layers, the API loads and starts; setuid, capabilities and runtime-stage additions read on the host
        working-directory: .
        run: docker/check-images.sh ascrum-api:ci ascrum-web:ci
      # spec §6 image-scan, owner's answers to Q-p5-image-cves-2 (a), Q-p5-image-scan-2 (a)+(c) and -3 (a):
      # Trivy on both images, two passes (HIGH/CRITICAL fixed or not; OS packages at every severity with a
      # fix). A pinned, checksum-verified release binary from the one action that holds the pin (never
      # trivy-action, a floating tag or `latest`: GHSA-69fq-xp46-6x23). Its vulnerability DB is downloaded
      # on every run; a failed download, a stale DB or a failed scan fails this step (docker/scan-images.sh).
      # No ignore list. The only exception is the dated nginx window for the web image's `nginx` package,
      # which closes by itself at nginx >= 1.30.7 or after 2026-12-31 and is announced on every run. ECR's
      # gate stays the final check on the deployed image.
      - name: Install Trivy (pinned, checksum-verified)
        uses: ./.github/actions/setup-trivy
      - name: Image scan (Trivy), both images, HIGH/CRITICAL and fixable OS findings fail
        working-directory: .
        env:
          SCAN_REPORT_DIR: ${{ runner.temp }}/trivy-reports
        run: docker/scan-images.sh ascrum-api:ci ascrum-web:ci
      # DEV-p5-image-scan-04 (b): the scan's reports must hold exactly the OS packages in apk's database and
      # the package.json packages in each image, both read on the host. A scan that silently read less
      # fails here instead of passing with no findings.
      - name: Image scan coverage (every OS and language package Trivy read), checked on the host
        working-directory: .
        run: docker/check-scan-coverage.sh ascrum-api:ci ascrum-web:ci "$RUNNER_TEMP/trivy-reports"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: ${{ runner.temp }}/trivy-reports
          if-no-files-found: ignore
          retention-days: 14
      - name: AC-CTR-01 docker compose up, wait until every service is healthy
        working-directory: .
        run: docker compose --profile prod-check up --wait --wait-timeout 180
      - name: AC-CTR-01 the full Playwright suite against the stack (with AC-CTR-03 and §3.3)
        run: pnpm e2e:compose
      - name: AC-SEC-04 behind nginx, the login throttle sees each client's address and ignores a forged one
        working-directory: .
        run: docker/check-client-address.sh
      - name: AC-CTR-03 the api health check without the database, and after it is back
        working-directory: .
        run: docker/check-health.sh
      - name: Stack logs
        if: failure()
        working-directory: .
        run: docker compose --profile prod-check logs --no-color --timestamps
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-compose
          path: web/playwright-report
          retention-days: 14
      - name: Tear down (always, also after a failure or a cancel)
        if: always()
        working-directory: .
        run: docker compose --profile prod-check down --volumes --remove-orphans

  # Phase 5 wave C (p5-infra): the CDK app in infra/ (its own package and lockfile, so web's gates do not
  # see it): lint, typecheck, the stack and script unit tests, and `cdk synth`. None of it may need AWS:
  # this job has no credentials, and every credential source is pointed at nothing, so a lookup or an
  # SDK call would fail the job instead of quietly using something.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    env:
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
      CDK_DISABLE_CLI_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: cdk synth without AWS credentials
        run: pnpm synth
